version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's build image ships with npm but not pnpm.
        - npm install -g pnpm@10.30.2
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - .next/cache/**/*
